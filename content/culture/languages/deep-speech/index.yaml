name: Deep Speech
kind: language
code: ds
summary: The shared working tongue of the [[culture/languages/deep-speech|Nuunlaumud]] — native to the older pre-drowning people of [[nuunlau|Nuunlau]], adopted by the [[kinds/urouthi|Urouthi]] who joined them after the drowning. _[[nuunlau/bal-rochan|Bal Rochan]]_, the deep's name for their largest settlement, is one of the few words known to the surface.
aliases: [the deep's tongue, the deep tongue]
tags: [bayurinda, deep]
