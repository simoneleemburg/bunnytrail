name: The Aetherians
kind: people
language: ds
summary: The populous majority among the [[languages/deep-speech|Nuunlaumud]] of [[places/nuunlau|Nuunlau]] — descendants of the survivors of [[places/bayurinda|Bayurinda]]'s drowned surface civilisation, modified to breathe water and taken in by the older deep. They read their own ancestors' inscriptions, in a tongue not their own; and they reach the [[beings/naya|Naya]] through a radiance on the seafloor, in a form of [[concepts/nearing|Nearing]] every Aetherian body is shaped for.
aliases: [Aetherians, aether-breathers]
tags:
