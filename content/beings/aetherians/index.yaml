name: The Aetherians
kind: mortal
language: ds
summary: The populous majority among the [[culture/languages/deep-speech|Nuunlaumud]] of [[nuunlau|Nuunlau]] — descendants of the survivors of [[bayurinda|Bayurinda]]'s drowned surface civilisation, modified to breathe water and taken in by the older deep. They read their own ancestors' inscriptions, in a tongue not their own; and they reach the [[beings/naya|Naya]] through a radiance on the seafloor, in a form of [[nearing|Nearing]] every Aetherian body is shaped for.
aliases: [Aetherians, aether-breathers]
tags:
