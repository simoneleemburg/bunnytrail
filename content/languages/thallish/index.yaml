name: Thallish
kind: language
language: tha
code: tha
summary: A language of [Alteria Cognita](/cognita) whose words have travelled further than the speakers themselves. Thallish supplies several of the compendium's standard cosmological terms — among them _Asthera_ and _Nareth_ — but the people who speak it, and the world they speak it on, are not yet recorded in this compendium.
aliases: [the Thallish tongue]
