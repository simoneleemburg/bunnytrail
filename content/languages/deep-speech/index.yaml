name: Deep Speech
kind: language
code: ds
summary: The shared working tongue of the [[languages/deep-speech|Nuunlaumud]] — native to the older pre-drowning people of [[places/nuunlau|Nuunlau]], adopted by the [[beings/aetherians|Aetherians]] who joined them after the drowning. Not Bayurindan, not Old Tongue, not yet recorded in any depth in this compendium. _[[places/bal-rochan|Bal Rochan]]_, the deep's name for their largest settlement, is one of the few words known to the surface.
aliases: [the deep's tongue, the deep tongue]
tags: [bayurinda, deep, gap-noted]
