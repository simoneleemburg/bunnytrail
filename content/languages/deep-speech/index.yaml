name: Deep Speech
kind: language
code: ds
summary: The working tongue of the deep of [[places/bayurinda|Bayurinda]] — not Bayurindan, not Old Tongue, not yet recorded in any depth in this compendium. _Bal Rochan_, the deep's name for their largest settlement, is one of the few words known to the surface.
aliases: [the deep's tongue, the deep tongue]
tags: [bayurinda, deep, gap-noted]
