name: Urouch
kind: material
summary: The Deep Speech name for the radioactive substance the [[beings/aetherians|Aetherians]] near by, and the energy substance on which long-term life in [[places/bayurinda/nuunlau|Nuunlau]] depends. Small black pellets with a distinct blue shine. No new Urouch has been made since the drowning; what is in circulation comes from un-scavenged ancient ruins on the seafloor.
tags: [material, scarce, radiance, deep, infrastructure]
