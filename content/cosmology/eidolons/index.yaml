name: Eidolons
kind: construct
summary: Constructed vessels that allow a Naya to manifest physically on Asthera. Each Eidolon holds one Naya, bound durably into its Skyblood-cored body. A Knight, when piloting, gives the Eidolon direction; the Eidolon does not require the Knight to exist.
tags: [construct, vessel, eidolon-knight, skyblood, naya]
