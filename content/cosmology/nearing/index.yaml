name: Nearing
kind: action
summary: A partially transcendent state in which a practitioner drifts closer to Nareth — loosening their attachment to physical needs, linear time, spatial distance, bodily form, and ordinary perception. The basis of oracular work, eidolon starfaring, Whispers, and the long lives of those who practise it.
tags: [practice, nareth, resonance, travel, whispers, oracle-triad]
