name: General Relativity
kind: law-of-nature
summary: Earth's standing account of gravity, distance, and time — Einstein's geometric theory in which mass and energy curve spacetime, the speed of light is the universal limit on causal influence, and no two distant events have an objective shared "now." Holds to extraordinary precision in every regime Earth has tested it; known to be incomplete at the smallest scales and inside black holes; silent on whatever else the universe is doing.
tags: [time, distance, gravity, spacetime, earth-science]
