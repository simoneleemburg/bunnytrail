name: Urouch
kind: material
summary: The Deep Speech name for the radioactive substance the [[beings/urouthi|Urouthi]] near by, and the energy substance on which long-term life in [[nuunlau|Nuunlau]] depends. Small black pellets with a distinct blue shine. No new Urouch has been made since the drowning; what is in circulation comes from un-scavenged ancient ruins on the seafloor.
tags: [scarce, radiance, deep, infrastructure]
