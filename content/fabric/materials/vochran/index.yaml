name: Vochran
kind: material
language: ds
summary: The breathable fluid that fills a [[beings/urouthi|Urouthi]]'s lungs in place of air — the medium by which the lost surface civilisation's descendants were given long-term life in [[nuunlau|Nuunlau]]. The word is [[culture/languages/deep-speech|Deep Speech]]. Whether Vochran is biological, refined, or older than either is not yet recorded here.
tags: [deep, fluid, post-drowning, gap-noted]
