singular: Region
plural: Regions
# TODO(worldbuilding): author a one-line description for the regions
# type-index page. Until then the page renders with no preamble.
kind: region
# Settlements physically nest inside their region's folder
# (e.g. regions/nuunlau/bal-rochan/). They declare `kind: settlement`
# on the entity; this `subkinds:` registration lets them sit inside
# a `kind: region` folder without tripping the uniformity rule.
subkinds:
  - kind: settlement
    kindParent: region
