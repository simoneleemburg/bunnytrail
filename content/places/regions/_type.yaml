singular: Region
plural: Regions
# TODO(worldbuilding): author a one-line description for the regions
# type-index page. Until then the page renders with no preamble.
kind: region
kindParent: place
# Settlements physically nest inside their region's folder
# (e.g. regions/nuunlau/bal-rochan/). They declare `kind: settlement`
# on the entity; this `subkinds:` registration lets them sit inside
# a `kind: region` folder without tripping the uniformity rule.
#
# `kindParent: place` (not `region`): a settlement *lives in* a
# region structurally, but isn't a *kind of* region — Bal Rochan
# is a city, not "a region that happens to be small". Parenting
# to `place` keeps settlements as their own branch of the places
# hierarchy, alongside regions rather than under them.
subkinds:
  - kind: settlement
    kindParent: place
