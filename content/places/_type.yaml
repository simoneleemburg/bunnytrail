singular: Place
plural: Places
description: >-
  The settings of Alteria — cities, ruins, wilds and pocket realms. Where
  things happen and where memory lingers.
# `place` is the root of the places kind hierarchy. Every kind that
# lives under content/places/ — celestial-body, region, settlement,
# realm, system — parents to it. The folder itself has no direct
# entities (every place lives inside a more specific subtype), so
# the uniformity rule never fires here.
kind: place
