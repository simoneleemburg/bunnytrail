name: Tranquility
kind: horizon
summary: >-
  The Horizon between [[source|the Source]] and [[self|the
  Self]] — the edge along which [[dissolution|Dissolution]] goes
  to its minimum. Pattern held in subjective reality, with
  nothing coming apart. Massive things approach Tranquility as
  the work of unbinding thins, but cannot reach it.
tags: [cosmology, tranquility, held, stillness]
