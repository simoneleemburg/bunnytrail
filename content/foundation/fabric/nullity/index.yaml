name: Nullity
kind: horizon
summary: >-
  The Horizon between [[self|the Self]] and [[chaos|Chaos]] —
  the edge along which [[essence|Essence]] goes to its minimum.
  Subjective reality coming apart without any pattern under it.
  Massive things approach Nullity as their participation in form
  thins, but cannot reach it.
tags: [cosmology, nullity, formless]
