name: Nearing
kind: phenomenon
summary: >-
  Active, willed motion in [[mundus|Mundus]] against the
  drift gradient — a thing leaning toward some point in
  εσδ-space other than its local
  [[equilibrium|Equilibrium]]. The opposite of
  [[foundation/fabric/drifting|Drifting]]. Any thing can near any
  [[kinds/cardinal|Cardinal]] in principle; what differs is
  how hard each lean is from where the thing is.
tags: [cosmology, motion, nearing, frame, will]
