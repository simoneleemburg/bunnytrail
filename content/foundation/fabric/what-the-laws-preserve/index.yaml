name: What the Laws Preserve
kind: law-of-nature
summary: >-
  The three foundation laws — [[mundus-frame|Mundus Frame]],
  [[subjective-time|Subjective Time]], and
  [[continuity-of-passage|Continuity of Passage]] — leave a
  consistent set of structural commitments standing across the
  generic geometry. Causality holds inside every frame. No frame
  can, by displacement alone, revisit its own past or reach
  across into another's. No path skips its passage. No
  displacement is a shortcut: whatever the lean changes about the
  journey, the traveller pays for it in the journey itself.
  εσδ-space is not bound to be generic everywhere; singularities
  and exotic connections are the carve-outs the geometry permits.
  This entry names what survives the divergences the three laws
  describe, and what the laws do not undertake to describe.
tags: [law, conservation, causality, displacement, cost, frame, singularity]
relations:
  - kind: governed-by
    target: foundation/fabric/mundus-frame
