name: Subjectivity
kind: axis
sigil: σ
summary: >-
  The axis of Mundus bounded by the Self and Oblivion. A
  thing's Subjectivity is the degree to which reality is shaped
  by its experience of it — the give of the world under the
  perceiver.
tags: [cosmology, self, experience, perception]
