name: The Self
kind: horizon
summary: >-
  The horizon of narrative continuity — the limit along which a
  being holds and tells itself as the same being from moment to
  moment. Massive things approach the Self as they shade toward
  pure memory, pure ego, pure subjective architecture, but
  cannot reach it.
tags: [cosmology, memory, ego, narrative, subjectivity]
sigil: 🜄
