name: Chaos
kind: horizon
summary: >-
  The horizon of dissolution — the limit along which coherent
  things come apart. Massive things approach Chaos as they
  decay, break, lose hold, lose form, but cannot reach it. Not
  an antagonist; one of the three limits within which Mundus
  takes its shape.
tags: [cosmology, entropy, dissolution, decay, disorder]
sigil: 🜂
