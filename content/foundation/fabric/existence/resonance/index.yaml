name: Resonance
kind: axis
summary: >-
  The axis of Mundus defined by the Source. A thing's Resonance
  is the measure of its closeness to its origin — the degree to
  which it is still in contact with the wellspring from which
  it, and every other self, first emerged.
tags: [cosmology, source, origin, wellspring]
relations:
