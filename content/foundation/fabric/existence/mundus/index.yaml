name: Mundus
kind: realm-of-existence
summary: >-
  The bounded interior in which massive existence happens. The
  region things have bodies in, persist across, occupy space
  in. Bounded by six bounds — three Cardinals (the Source, the
  Self, Chaos) at the corners and three Horizons along the
  edges between them — but distinct from all of them. Where
  everything that is, is.
tags: [cosmology, matter, form, embodiment, persistence, mundus]
sigil: 🜃
