name: Subjective Time
kind: law-of-nature
summary: >-
  Time still flows everywhere in [[mundus|Mundus]], but its rate runs
  together only near [[equilibrium|Equilibrium]]. The further a thing is
  displaced from Equilibrium in εσδ-space — whether by a rotated
  [[mundus-frame|Mundus Frame]] or by sustained
  [[foundation/fabric/nearing|nearing]] — the more its subjective
  duration decouples from the duration measured in the shared
  Equilibrium frame. Subjective time always runs longer per unit of
  Equilibrium time as displacement grows. Causality is preserved
  locally; what changes is the rate at which subjective time
  accumulates.
tags: [time, frame, equilibrium, nearing, cardinal, displacement, causality]
relations:
  - kind: governed-by
    target: foundation/fabric/mundus-frame
