name: Space-time and Identity Shift
kind: law-of-nature
summary: There is no universe-wide clock relating one cluster of Alteria to another — the physics of distance forbid it, and Nearing, the only practice known to bridge such distances, loosens linear time and identity alongside spatial distance. Cross-cluster claims about timing are claims about what an account records, not about an objective shared moment.
tags: [nareth, nearing, resonance, time, distance, identity, accounts]
