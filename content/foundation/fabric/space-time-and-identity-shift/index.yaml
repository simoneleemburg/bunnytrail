name: Space-time and Identity Shift
kind: law-of-nature
summary: >-
  The cross-cluster face of [[subjective-time|subjective time]] and
  [[mundus-frame|Mundus Frame]] composition. There is no
  universe-wide clock relating one cluster of Alteria to another;
  the only known way to bridge such distances —
  [[aurethia/fabric/nearing|Nearing]] — loosens linear time and
  identity alongside spatial distance, and the traveller who arrives
  is not precisely the traveller who set out. Cross-cluster claims
  about timing are claims about what an account records, not about
  an objective shared moment.
tags: [nareth, nearing, time, distance, identity, accounts, cross-cluster]
