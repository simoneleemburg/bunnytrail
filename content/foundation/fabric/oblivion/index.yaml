name: Oblivion
kind: horizon
summary: >-
  The Horizon between [[source|the Source]] and [[chaos|Chaos]] —
  the edge along which [[subjectivity|Subjectivity]] goes to its
  minimum. Pattern that persists or unbinds with no one in to
  witness it. Massive things approach Oblivion as their inside
  thins, but cannot reach it.
tags: [cosmology, oblivion, unwitnessed]
