name: Mundus Frame
kind: mundus-frame
summary: >-
  The map between a thing's local experience of
  [[mundus|Mundus]] and the global εσδ geometry. Fixes which
  point in εσδ-space counts as
  [[equilibrium|Equilibrium]] for that thing in that place,
  and therefore which direction it drifts when nothing pulls
  it otherwise. Composed of the thing's nature and the place
  it occupies.
tags: [cosmology, geometry, frame, drift, equilibrium]
