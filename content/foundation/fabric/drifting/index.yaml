name: Drifting
kind: phenomenon
summary: >-
  Passive motion in [[mundus|Mundus]] toward the local
  [[equilibrium|Equilibrium]] — the εσδ-point that a thing's
  [[mundus-frame|Mundus Frame]] picks out as its low point.
  What happens to a thing when nothing else is acting on it.
  Different things drift in different εσδ-directions because
  their frames are rotated differently; the basin itself is
  the same everywhere.
tags: [cosmology, motion, drift, frame, equilibrium]
