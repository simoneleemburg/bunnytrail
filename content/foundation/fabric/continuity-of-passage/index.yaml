name: Continuity of Passage
kind: law-of-nature
summary: >-
  Any path a thing takes through [[mundus|Mundus]] is continuous in
  ordinary space. εσδ-displacement — whether from a rotated
  [[mundus-frame|Mundus Frame]], from sustained
  [[foundation/fabric/nearing|nearing]], or both — changes how a
  journey is experienced, how long it takes in
  [[subjective-time|subjective time]], and what is encountered
  along it. It does not change the topology of the space that
  must be crossed. There is no teleportation in Alteria.
tags: [space, path, continuity, frame, nearing, displacement, topology]
relations:
  - kind: governed-by
    target: foundation/fabric/mundus-frame
