name: Equilibrium
kind: equilibrium
summary: >-
  The centroid region of [[mundus|Mundus]] — the soft basin
  where [[essence|Essence]], [[subjectivity|Subjectivity]] and
  [[dissolution|Dissolution]] are in balance and no bound
  pulls harder than another. Massive things in Mundus drift
  toward Equilibrium but wobble within it; nothing rests
  exactly at the centre.
tags: [cosmology, centre, ordinary, balance]
sigil: ∪
