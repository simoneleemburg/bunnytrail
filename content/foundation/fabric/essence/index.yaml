name: Essence
kind: axis
summary: >-
  The axis of Mundus bounded by the Source and Nullity. A
  thing's Essence is the measure of how much of its character is
  its participation in a general pattern, and how much is the
  particulars it happens to have. High Essence is
  pattern-dominated; low Essence is accident-dominated.
tags: [cosmology, source, pattern, particularity]
relations:
  - kind: bounded-by
    target: foundation/fabric/source
  - kind: bounded-by
    target: foundation/fabric/nullity
