name: Chaos
kind: realm-of-existence
summary: >-
  The foundational layer along which things come apart —
  entropy, decay, the dimension of dissolution and disorder.
  Peer to the Source, the Self, and Mundus rather than their
  opposite; one of the four axes along which what-there-is can
  be said to exist at all.
