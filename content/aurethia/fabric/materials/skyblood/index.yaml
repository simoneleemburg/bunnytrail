name: Skyblood
kind: material
summary: A rare celestial material left behind by an ancient shattering. Inert in itself with respect to ordinary geometry, but able to trap a Source-tilted nature-frame at the point of contact — which is what lets a [[kinds/naya|Naya]] be held in a vessel. Everything the [[binding|binding]] practice and the [[kinds/eidolon|Eidolons]] do follows from the Naya's own outward [[aurethia/fabric/nearing|Nearing]] from that anchor, not from any field of the Skyblood itself.
tags: [sacred, scarce, divine-remnant, source, nature-frame]
