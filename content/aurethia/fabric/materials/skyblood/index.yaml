name: Skyblood
kind: material
summary: A rare celestial material left behind by an ancient shattering — the only material the cluster has so far identified that can hold a Source-rotated place-frame in ordinary matter. Inside a region of Skyblood, local Equilibrium sits at the [[source|Source]]. This single fact is what makes [[binding|binding]] of [[kinds/naya|Naya]] into [[kinds/eidolon|Eidolons]] possible, what makes piloting them survivable for [[culture/eidolon-knight|Knights]], and what makes the vessels work at all.
tags: [sacred, scarce, divine-remnant, place-frame, source]
