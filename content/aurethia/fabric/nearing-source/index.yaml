name: Nearing-Source
kind: phenomenon
summary: The Aurethian account of [[foundation/fabric/nearing|nearing]] toward [[source|the Source]] — a partially transcendent state in which a practitioner drifts closer to [[realms/nareth|Nareth]], loosening their attachment to physical needs, linear time, spatial distance, bodily form, and ordinary perception. The basis of oracular work, eidolon starfaring, Whispers, and the long lives of those who practise it. Aurethia's central, well-developed tradition of nearing.
tags: [practice, nareth, resonance, travel, whispers, oracle-triad]
