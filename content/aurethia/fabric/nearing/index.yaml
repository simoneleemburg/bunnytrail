summary: The Aurethian account of [[foundation/fabric/nearing|nearing]] — willed motion against the local drift gradient. The cluster's central body of practice along this axis is Source-ward, and the unmarked word _Nearing_ in Aurethian usage refers to that direction. Chaos-ward and Self-ward leans are known too, the latter only in passing; the Chaos-ward lean is recorded almost entirely in its failure form.
