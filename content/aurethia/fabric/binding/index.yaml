name: Binding
kind: phenomenon
summary: The pact by which a [[kinds/naya|Naya]] is seated into an [[kinds/eidolon|Eidolon]] — bound, in the strict sense, to the physical world by way of a vessel that can hold it. In foundation terms, the vessel's Skyblood core traps the Naya's Source-tilted nature-frame at the point of contact, interrupting the drift back to Nareth. Almost everything the Eidolon does as a vessel is the Naya's outward Nearing from that anchor, projected through the vessel's shape.
tags: [practice, naya, eidolon, identity, source, nature-frame]
