name: Binding
kind: phenomenon
summary: The pact by which a [[kinds/naya|Naya]] is seated into an [[kinds/eidolon|Eidolon]] — bound, in the strict sense, to the physical world by way of a vessel that can hold it. In foundation terms, the vessel's Skyblood core rotates the place-frame inside the construct Source-ward, bringing local Equilibrium to the point the Naya's nature-frame asks for. The Naya is at rest because the geometry around it has stopped asking it to be anywhere else.
tags: [practice, naya, eidolon, identity, place-frame, source]
