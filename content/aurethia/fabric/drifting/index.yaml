name: Drifting
kind: phenomenon
summary: The Chaos-axis counterpart to Nearing and Valdor traversal — what happens to a being whose coherence fails far enough that they are no longer holding their place in the ordinary world. Unlike Nearing or Valdor traversal, Drifting is not undertaken deliberately. It is what a pilot falls into, not a passage a pilot heads toward.
tags: [chaos, void, coherence, failure, transit]
