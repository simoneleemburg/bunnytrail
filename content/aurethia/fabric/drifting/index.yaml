name: Drifting
kind: phenomenon
summary: The Aurethian name for [[foundation/fabric/drifting|foundation-drifting]] when it carries a being toward [[chaos|Chaos]] — what happens to a pilot whose [[binding|binding]] slips and whose effective [[mundus-frame|Mundus Frame]] has rotated, in the regions Aurethia knows as [[realms/the-void|the Void Between Worlds]], such that local Equilibrium has moved Chaos-ward. Unlike Nearing or Valdor traversal, Drifting is not undertaken deliberately; it is what a pilot falls into when the work of holding together fails.
tags: [chaos, void, coherence, failure, transit]
