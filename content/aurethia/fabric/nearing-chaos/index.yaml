name: Nearing-Chaos
kind: phenomenon
sigil: δ↥
summary: >-
  The Aurethian account of [[foundation/fabric/nearing|nearing]]
  toward [[chaos|Chaos]] — leaning into the loosening of the
  structures that hold a thing one thing. Aurethia knows this
  almost entirely in its passive form: what happens to a pilot
  whose [[binding|binding]] slips in the long passages between
  [[kinds/world-pillar|Pillars]], whose grip on themselves and
  their [[kinds/naya|Naya]] fails, and who finds themselves in
  [[realms/the-void|the Void Between Worlds]] without having
  meant to be. A deliberate practice of nearing-Chaos, if any
  exists in the cluster, is not recorded.
tags: [chaos, void, coherence, nearing, failure, transit]
relations:
  - kind: local-account-of
    target: foundation/fabric/nearing
