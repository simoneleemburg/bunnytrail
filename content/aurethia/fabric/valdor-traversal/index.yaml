name: Valdor Traversal
kind: phenomenon
summary: The Valdor-side counterpart to Nearing — a process in which a being moves deeply through their own narrative, memory, and subjective architecture, and may emerge fundamentally transformed. Never automatic; entering Valdor does not by itself alter identity. The shift occurs only if the traveller willingly undergoes the passage.
tags: [practice, valdor, memory, ego, transformation]
