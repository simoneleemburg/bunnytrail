name: Eidolon Knight
kind: role
summary: A human who pilots an Eidolon — sustaining contact with the Naya bound inside it as a form of Nearing. Knighthood is held by a single interplanetary order, the Knights of Bellona, whose ideal is the slowly built fit between a Knight and a chosen Eidolon.
tags: [eidolon, piloting, knight, nearing]
