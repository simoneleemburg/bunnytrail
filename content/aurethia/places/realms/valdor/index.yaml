name: Valdor
kind: realm
language: tha
summary: >-
  A liminal realm of memory, ego, and subjective reality.
  Geography here is built out of the traveller's own narrative
  and inner architecture — eras stand adjacent like landscapes,
  and no two travellers see Valdor the same way. Counterpart of
  sorts to Nareth, on a different axis: where Nareth loosens
  identity, Valdor externalises what is built around it.
aliases: [the Memory Realm, the subjective layer]
tags: [cosmology, memory, transformation]
sigil: 🜄
relations:
  - kind: region-of
    target: foundation/fabric/mundus
  - kind: approaches
    target: foundation/fabric/self
