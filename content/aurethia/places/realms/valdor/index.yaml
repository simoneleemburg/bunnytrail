name: Valdor
kind: realm
language: tha
summary: >-
  The Self-rotated region of Mundus. The Aurethian name for the
  liminal realm where memory and ego become landscape. The terrain
  is not preserved history but imprints of remembered selfhood
  expressed under the lean: a traveller may cross what looks like
  another era and find, on returning, that ordinary geography
  reasserts. Counterpart of sorts to Nareth on a different axis —
  where Nareth loosens identity, Valdor externalises what is
  built around it.
aliases: [the Memory Realm, the subjective layer]
tags: [cosmology, memory, transformation]
sigil: 🜄
relations:
  - kind: region-of
    target: foundation/fabric/mundus
  - kind: approaches
    target: foundation/fabric/self
