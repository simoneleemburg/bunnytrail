singular: Mundus Frame
plural: Mundus Frames
description: >-
  The map between a thing's local experience of
  [[mundus|Mundus]] and the global εσδ geometry. A frame
  fixes where, in εσδ, that thing's [[equilibrium|Equilibrium]]
  lies — and therefore which direction is "downhill" for it.
  Frames are composed of a thing's nature and the place it
  occupies.
