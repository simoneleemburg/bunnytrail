singular: Realm of Existence
plural: Realms of Existence
description: >-
  A foundational layer of reality — one of the few axes along
  which what-there-is can be said to exist at all. Realms of
  existence are universal: not local to any cluster, not named
  in any one tradition's vocabulary. Particular clusters'
  cosmologies name them in their own terms, but the layer
  itself sits underneath every account.
