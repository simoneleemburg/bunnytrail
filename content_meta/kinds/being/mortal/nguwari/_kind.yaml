singular: Nguwari
plural: Nguwari
description: >-
  An amphibious, serpentine-bodied people native to Bayurinda —
  threshold dwellers at the half-tide line, the seam between the
  archipelago's upper world and Nuunlau. The name is Bayurindan
  and glosses as "border swimmers." Individual Nguwari recorded
  in the compendium are classified under this kind.
