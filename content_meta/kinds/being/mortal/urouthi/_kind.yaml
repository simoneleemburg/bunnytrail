singular: Urouthi
plural: Urouthi
description: >-
  The populous majority among the Nuunlaumud of Nuunlau —
  descendants of the survivors of Bayurinda's drowned surface
  civilisation, modified to breathe water and taken in by the
  older deep. They read their own ancestors' inscriptions in a
  tongue not their own, and reach the Naya through a radiance
  on the seafloor every Urouthi body is shaped for. The name
  is their own, in Deep Speech — _people of Urouch_, the
  radiance their lives are bent around.
