singular: Axis
plural: Axes
description: >-
  One of the three structural quantities by which a thing's position
  in Mundus is measured. Each axis runs from one of the three
  Cardinals (its maximum) to the opposite Horizon (its minimum).
  The three axes — Essence, Subjectivity, Dissolution — are not
  independent; they are three readings of one position in the
  interior of Mundus.
