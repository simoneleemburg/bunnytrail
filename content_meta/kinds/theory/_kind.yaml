singular: Theory
plural: Theories
description: >-
  A written, taught, or otherwise carried explanation that a
  community offers for how some part of the world works. Not the
  workings themselves — those are phenomena and laws — but the
  intellectual artefact built up around them. Theories can be
  well-tested or speculative, complete or partial, current or
  superseded. They are how a cluster's understanding of its own
  cosmos is held, refined, and handed on.
